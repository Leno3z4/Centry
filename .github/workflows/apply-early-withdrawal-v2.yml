name: Apply early withdrawal v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found: {path}: {old[:100]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'pattern is not unique: {path}: found {s.count(old)}')
              p.write_text(s.replace(old, new))

          # Voting escrow economics and treasury destination.
          once('contracts/governance/CentryVotingEscrow.sol',
               '    uint256 public constant MAX_LOCK = 104 weeks;\n',
               '    uint256 public constant MAX_LOCK = 104 weeks;\n    uint256 public constant BPS = 10_000;\n    uint256 public constant EARLY_WITHDRAW_FEE_BPS = 2_500;\n    uint256 public constant EARLY_WITHDRAW_REWARD_SHARE_BPS = 6_000;\n')
          once('contracts/governance/CentryVotingEscrow.sol',
               '    IERC20 public immutable token;\n    address public immutable admin;\n',
               '    IERC20 public immutable token;\n    address public immutable admin;\n    address public immutable treasury;\n')
          once('contracts/governance/CentryVotingEscrow.sol',
               '    error ZeroAmount();\n    error ZeroToken();\n',
               '    error ZeroAmount();\n    error ZeroToken();\n    error ZeroTreasury();\n    error RewardsControllerNotSet();\n')
          once('contracts/governance/CentryVotingEscrow.sol',
               '    event Withdrawn(\n        address indexed user,\n        uint256 indexed tokenId,\n        uint256 amount\n    );\n',
               '    event Withdrawn(\n        address indexed user,\n        uint256 indexed tokenId,\n        uint256 amount\n    );\n\n    event EarlyWithdrawn(\n        address indexed user,\n        uint256 indexed tokenId,\n        uint256 principal,\n        uint256 fee,\n        uint256 rewardShare,\n        uint256 treasuryShare,\n        uint256 returnedAmount\n    );\n')
          once('contracts/governance/CentryVotingEscrow.sol',
               '''    constructor(address token_)\n        ERC721("Centry Vote Escrow", "veCENT")\n    {\n        if (token_ == address(0)) {\n            revert ZeroToken();\n        }\n\n        token = IERC20(token_);\n        admin = msg.sender;\n    }\n''',
               '''    constructor(address token_, address treasury_)\n        ERC721("Centry Vote Escrow", "veCENT")\n    {\n        if (token_ == address(0)) {\n            revert ZeroToken();\n        }\n\n        if (treasury_ == address(0)) {\n            revert ZeroTreasury();\n        }\n\n        token = IERC20(token_);\n        admin = msg.sender;\n        treasury = treasury_;\n    }\n''')
          once('contracts/governance/CentryVotingEscrow.sol',
               '''    function withdraw(\n        uint256 tokenId\n    ) external nonReentrant {\n        if (ownerOf(tokenId) != msg.sender) {\n            revert NoLock();\n        }\n\n        Lock memory lock = locks[tokenId];\n\n        if (block.timestamp < lock.end) {\n            revert LockNotExpired();\n        }\n\n        _checkpointVotingPower(\n            tokenId\n        );\n\n        delete locks[tokenId];\n        delete lastVotingPowerCheckpoint[tokenId];\n\n        _burn(\n            tokenId\n        );\n\n        token.safeTransfer(\n            msg.sender,\n            lock.amount\n        );\n\n        emit Withdrawn(\n            msg.sender,\n            tokenId,\n            lock.amount\n        );\n    }\n''',
               '''    function withdraw(\n        uint256 tokenId\n    ) external nonReentrant {\n        if (ownerOf(tokenId) != msg.sender) {\n            revert NoLock();\n        }\n\n        Lock memory lock = locks[tokenId];\n        bool early = block.timestamp < lock.end;\n\n        _checkpointVotingPower(\n            tokenId\n        );\n\n        delete locks[tokenId];\n        delete lastVotingPowerCheckpoint[tokenId];\n\n        if (early) {\n            if (rewardsController == address(0)) {\n                revert RewardsControllerNotSet();\n            }\n\n            uint256 fee = (\n                uint256(lock.amount) *\n                EARLY_WITHDRAW_FEE_BPS\n            ) / BPS;\n\n            uint256 rewardShare = (\n                fee *\n                EARLY_WITHDRAW_REWARD_SHARE_BPS\n            ) / BPS;\n\n            uint256 treasuryShare =\n                fee - rewardShare;\n\n            uint256 returnedAmount =\n                uint256(lock.amount) - fee;\n\n            _burn(\n                tokenId\n            );\n\n            token.safeTransfer(\n                address(rewardsController),\n                rewardShare\n            );\n\n            token.safeTransfer(\n                treasury,\n                treasuryShare\n            );\n\n            token.safeTransfer(\n                msg.sender,\n                returnedAmount\n            );\n\n            emit EarlyWithdrawn(\n                msg.sender,\n                tokenId,\n                lock.amount,\n                fee,\n                rewardShare,\n                treasuryShare,\n                returnedAmount\n            );\n\n            return;\n        }\n\n        _burn(\n            tokenId\n        );\n\n        token.safeTransfer(\n            msg.sender,\n            lock.amount\n        );\n\n        emit Withdrawn(\n            msg.sender,\n            tokenId,\n            lock.amount\n        );\n    }\n''')

          # Rewards preserve claim rights after veCENT burn.
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '    mapping(uint256 => address) public selfRepayRecipient;\n    mapping(uint256 => address) public selfRepayOwner;\n',
               '    mapping(uint256 => address) public selfRepayRecipient;\n    mapping(uint256 => address) public selfRepayOwner;\n\n    mapping(uint256 => address) public withdrawnPositionOwner;\n')
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '    event SelfRepayDisabled(\n        uint256 indexed tokenId,\n        address indexed owner\n    );\n',
               '    event SelfRepayDisabled(\n        uint256 indexed tokenId,\n        address indexed owner\n    );\n\n    event PositionClosed(\n        uint256 indexed tokenId,\n        address indexed owner\n    );\n')
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '''    function claim(\n        uint256 epoch,\n        uint256 tokenId,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = veCENT.ownerOf(tokenId);\n\n        if (owner != msg.sender) {\n            revert NotOwner();\n        }\n''',
               '''    function claim(\n        uint256 epoch,\n        uint256 tokenId,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = positionOwner(tokenId);\n\n        if (owner != msg.sender) {\n            revert NotOwner();\n        }\n''')
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '''    function claimTo(\n        uint256 epoch,\n        uint256 tokenId,\n        address recipient,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = veCENT.ownerOf(tokenId);\n\n        if (owner != msg.sender) {\n            revert NotOwner();\n        }\n''',
               '''    function claimTo(\n        uint256 epoch,\n        uint256 tokenId,\n        address recipient,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = positionOwner(tokenId);\n\n        if (owner != msg.sender) {\n            revert NotOwner();\n        }\n''')
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '''    function claimForSelfRepay(\n        uint256 epoch,\n        uint256 tokenId,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = veCENT.ownerOf(tokenId);\n        address recipient = selfRepayRecipient[tokenId];\n''',
               '''    function claimForSelfRepay(\n        uint256 epoch,\n        uint256 tokenId,\n        uint256 amount,\n        bytes32[] calldata proof\n    ) external nonReentrant returns (uint256) {\n        address owner = positionOwner(tokenId);\n        address recipient = selfRepayRecipient[tokenId];\n''')
          once('contracts/governance/CentryVeCENTRevenueRewards.sol',
               '''    function onVeCENTTransfer(\n        uint256 tokenId,\n        address from,\n        address to\n    ) external override {\n        if (msg.sender != address(veCENT)) {\n            revert TransferHookUnauthorized();\n        }\n\n        if (\n            from != address(0) &&\n            from != to &&\n            selfRepayRecipient[tokenId] != address(0)\n        ) {\n            _clearSelfRepay(tokenId, from);\n        }\n    }\n''',
               '''    function onVeCENTTransfer(\n        uint256 tokenId,\n        address from,\n        address to\n    ) external override {\n        if (msg.sender != address(veCENT)) {\n            revert TransferHookUnauthorized();\n        }\n\n        if (from == address(0) || from == to) {\n            return;\n        }\n\n        if (to == address(0)) {\n            withdrawnPositionOwner[tokenId] = from;\n            emit PositionClosed(tokenId, from);\n            return;\n        }\n\n        if (selfRepayRecipient[tokenId] != address(0)) {\n            _clearSelfRepay(tokenId, from);\n        }\n\n        delete withdrawnPositionOwner[tokenId];\n    }\n\n    function positionOwner(\n        uint256 tokenId\n    ) public view returns (address owner) {\n        try veCENT.ownerOf(tokenId) returns (address activeOwner) {\n            return activeOwner;\n        } catch {\n            return withdrawnPositionOwner[tokenId];\n        }\n    }\n''')

          # Executor uses the reward contract's position owner so closed locks can self-repay.
          once('contracts/core/CentrySelfRepayExecutorV2.sol',
               'interface ICentryVeCENTRevenueRewards {\n    function rewardToken() external view returns (address);\n\n    function veCENT() external view returns (address);\n\n    function claimForSelfRepay(',
               'interface ICentryVeCENTRevenueRewards {\n    function rewardToken() external view returns (address);\n\n    function veCENT() external view returns (address);\n\n    function positionOwner(uint256 tokenId) external view returns (address);\n\n    function claimForSelfRepay(')
          once('contracts/core/CentrySelfRepayExecutorV2.sol',
               '        address borrower = veCENT.ownerOf(tokenId);\n\n        if (borrower == address(0)) {\n            revert InvalidAddress();\n        }\n',
               '        address borrower = rewardsController.positionOwner(tokenId);\n\n        if (borrower == address(0)) {\n            revert InvalidAddress();\n        }\n')

          # Frontend ABI and write hook.
          once('frontend/constants/abis.js',
               "  {\n    type: 'function',\n    name: 'withdraw',\n    stateMutability: 'nonpayable',\n    inputs: [{ name: 'tokenId', type: 'uint256' }],\n    outputs: [],\n  },\n",
               "  {\n    type: 'function',\n    name: 'withdraw',\n    stateMutability: 'nonpayable',\n    inputs: [{ name: 'tokenId', type: 'uint256' }],\n    outputs: [],\n  },\n  {\n    type: 'function',\n    name: 'EARLY_WITHDRAW_FEE_BPS',\n    stateMutability: 'view',\n    inputs: [],\n    outputs: [{ type: 'uint256' }],\n  },\n")
          once('frontend/hooks/useVeGovernance.js',
               "  const extendLock = (tokenId, weeks) => sendAndWait({\n    address: CONTRACT_ADDRESSES.veCentry,\n    abi: VE_CENTRY_ABI,\n    functionName: 'extendLock',\n    args: [tokenId, BigInt(weeks) * 7n * 24n * 60n * 60n],\n  });\n",
               "  const extendLock = (tokenId, weeks) => sendAndWait({\n    address: CONTRACT_ADDRESSES.veCentry,\n    abi: VE_CENTRY_ABI,\n    functionName: 'extendLock',\n    args: [tokenId, BigInt(weeks) * 7n * 24n * 60n * 60n],\n  });\n\n  const withdrawLock = (tokenId) => sendAndWait({\n    address: CONTRACT_ADDRESSES.veCentry,\n    abi: VE_CENTRY_ABI,\n    functionName: 'withdraw',\n    args: [tokenId],\n  });\n")
          once('frontend/hooks/useVeGovernance.js',
               '    extendLock,\n    refetchAll,\n',
               '    extendLock,\n    withdrawLock,\n    refetchAll,\n')

          # Governance UI: add early-exit action.
          page = Path('frontend/app/app/governance/page.jsx')
          s = page.read_text()
          marker = '  const extendPosition = async (tokenId, currentWeeks) => {\n'
          if marker not in s:
              raise SystemExit('governance handler marker missing')
          handler = '''  const withdrawPosition = async (tokenId) => {\n    if (busyPosition) return;\n    const confirmed = window.confirm(\n      'Early withdrawal returns 75% of the locked CENT. The remaining 25% is split 60/40 between RevenueRewards and treasury. Already-earned rewards remain claimable.'\n    );\n    if (!confirmed) return;\n    try {\n      setNotice('');\n      setBusyPosition(`withdraw-${tokenId}`);\n      await governance.withdrawLock(BigInt(tokenId));\n      await governance.refetchAll();\n      setNotice(`veCENT #${tokenId} withdrawn. Your earned rewards remain claimable.`);\n    } catch (error) {\n      setNotice(error?.shortMessage || error?.message || 'Transaction failed.');\n    } finally {\n      setBusyPosition(null);\n    }\n  };\n\n'''
          s = s.replace(marker, handler + marker, 1)
          pattern = r'(\n\s*)<div className="position-actions-grid">'
          replacement = r'''\1<div className="position-early-exit">\n\1  <div>\n\1    <span>Early exit</span>\n\1    <strong>25% fee · 75% returned</strong>\n\1  </div>\n\1  <button\n\1    type="button"\n\1    className="secondary-btn early-exit-btn"\n\1    disabled={busyPosition !== null || position.weeksLeft <= 0}\n\1    onClick={() => withdrawPosition(position.tokenId)}\n\1  >\n\1    {busyPosition === `withdraw-${position.tokenId}` ? 'Working…' : 'Exit early'}\n\1  </button>\n\1</div>\n\1<div className="position-actions-grid">'''
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('governance action marker missing')
          css_marker = '        .position-actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}\n'
          css_new = '        .position-early-exit{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:13px 14px;border:1px solid #3a2a48;border-radius:11px;background:rgba(48,24,35,.34)}\n        .position-early-exit span{display:block;color:#8f849d;font-size:11px}.position-early-exit strong{display:block;margin-top:4px;font-size:13px}\n        .early-exit-btn{white-space:nowrap}\n        .position-actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}\n'
          if css_marker not in s:
              raise SystemExit('governance css marker missing')
          s = s.replace(css_marker, css_new, 1)
          page.write_text(s)

          # Deployment guide: document the new constructor and economics without changing old addresses.
          doc = Path('contracts/REMIX_DEPLOYMENT.md')
          ds = doc.read_text()
          if '## Early withdrawal v2' not in ds:
              anchor = '## 1. Compiler\n'
              section = '''## Early withdrawal v2\n\nThe v2 veCENT escrow constructor is:\n\n```text\nCentryVotingEscrow(token_, treasury_)\n```\n\nEarly withdrawal economics:\n- 25% of locked CENT is charged as the early-exit fee.\n- 60% of that fee goes to RevenueRewards.\n- 40% of that fee goes to treasury.\n- 75% of the locked principal is returned to the user.\n- Voting power becomes zero immediately after early withdrawal.\n- Already-published rewards remain claimable by the withdrawn position owner.\n\nThe new VotingEscrow, RevenueRewards, RevenueEngine, revenue-side UnitFlow adapter, and SelfRepayExecutorV2 form the v2 dependency chain. Existing lending contracts and UnitFlow infrastructure do not need to be redeployed.\n\n'''
              if anchor not in ds:
                  raise SystemExit('deployment guide anchor missing')
              ds = ds.replace(anchor, section + anchor, 1)
              doc.write_text(ds)

          print('v2 early withdrawal source patch complete')
          PY

      - name: Static verification
        run: |
          git diff --check
          grep -R "EARLY_WITHDRAW_FEE_BPS" -n contracts/governance/CentryVotingEscrow.sol frontend/constants/abis.js
          grep -R "withdrawnPositionOwner\|function positionOwner" -n contracts/governance/CentryVeCENTRevenueRewards.sol
          grep -R "rewardsController.positionOwner" -n contracts/core/CentrySelfRepayExecutorV2.sol
          grep -R "withdrawLock\|Exit early\|25% fee" -n frontend/hooks/useVeGovernance.js frontend/app/app/governance/page.jsx
          node --check frontend/hooks/useVeGovernance.js

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/governance/CentryVotingEscrow.sol contracts/governance/CentryVeCENTRevenueRewards.sol contracts/core/CentrySelfRepayExecutorV2.sol frontend/constants/abis.js frontend/hooks/useVeGovernance.js frontend/app/app/governance/page.jsx contracts/REMIX_DEPLOYMENT.md
          git commit -m "feat: add penalized early veCENT withdrawal"
          git push
