name: Apply early withdrawal v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify early-withdrawal v2 implementation
        run: |
          python3 <<'PY'
          from pathlib import Path

          checks = {
              'contracts/governance/CentryVotingEscrow.sol': [
                  'uint256 public constant BPS = 10_000;',
                  'uint256 public constant EARLY_WITHDRAW_FEE_BPS = 2_500;',
                  'uint256 public constant EARLY_WITHDRAW_REWARD_SHARE_BPS = 6_000;',
                  'address public immutable treasury;',
                  'bool early = block.timestamp < lock.end;',
                  'error RewardsControllerNotSet();',
                  'constructor(address token_, address treasury_)',
              ],
              'contracts/governance/CentryVeCENTRevenueRewards.sol': [
                  'mapping(uint256 => address) public withdrawnPositionOwner;',
                  'function positionOwner(uint256 tokenId)',
                  'address owner = positionOwner(tokenId);',
                  'if (to == address(0))',
              ],
              'contracts/core/CentrySelfRepayExecutorV2.sol': [
                  'function positionOwner(uint256 tokenId) external view returns (address);',
                  'address borrower = rewardsController.positionOwner(tokenId);',
              ],
              'frontend/hooks/useVeGovernance.js': [
                  "const withdrawLock = (tokenId) => sendAndWait({",
                  "functionName: 'withdraw',",
              ],
              'frontend/app/app/governance/page.jsx': [
                  'const withdrawPosition = async (tokenId)',
                  'Early exit',
                  '75% returned',
              ],
          }

          missing = []
          for filename, needles in checks.items():
              path = Path(filename)
              if not path.exists():
                  missing.append(f'{filename}: file missing')
                  continue
              text = path.read_text()
              for needle in needles:
                  if needle not in text:
                      missing.append(f'{filename}: missing {needle!r}')

          if missing:
              print('Early-withdrawal v2 verification FAILED:')
              for item in missing:
                  print(f'  - {item}')
              raise SystemExit(1)

          print('Early-withdrawal v2 implementation verified successfully.')
          print('No source patch is required; the v2 implementation is already present on main.')
          PY

      - name: Check repository diff
        run: git diff --check
