name: Apply early withdrawal v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, repl, flags=0):
              p = Path(path); s = p.read_text()
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1: raise SystemExit(f'missing pattern in {path}: {pattern}')
              p.write_text(s2)

          # VotingEscrow: constructor takes treasury; early exit is 25% and split 60/40.
          sub('contracts/governance/CentryVotingEscrow.sol',
              r'(uint256 public constant MAX_LOCK = 104 weeks;\n)',
              r'\1    uint256 public constant BPS = 10_000;\n    uint256 public constant EARLY_WITHDRAW_FEE_BPS = 2_500;\n    uint256 public constant EARLY_WITHDRAW_REWARD_SHARE_BPS = 6_000;\n')
          sub('contracts/governance/CentryVotingEscrow.sol',
              r'(IERC20 public immutable token;\n    address public immutable admin;\n)',
              r'\1    address public immutable treasury;\n')
          sub('contracts/governance/CentryVotingEscrow.sol',
              r'(error ZeroAmount\(\);\n    error ZeroToken\(\);\n)',
              r'\1    error ZeroTreasury();\n    error RewardsControllerNotSet();\n')
          sub('contracts/governance/CentryVotingEscrow.sol',
              r'(constructor\(address token_\)\n        ERC721\("Centry Vote Escrow", "veCENT"\)\n    \{.*?token = IERC20\(token_\);\n        admin = msg.sender;\n    \})',
              '''constructor(address token_, address treasury_)\n        ERC721("Centry Vote Escrow", "veCENT")\n    {\n        if (token_ == address(0)) {\n            revert ZeroToken();\n        }\n\n        if (treasury_ == address(0)) {\n            revert ZeroTreasury();\n        }\n\n        token = IERC20(token_);\n        admin = msg.sender;\n        treasury = treasury_;\n    }''',
              flags=re.S)
          sub('contracts/governance/CentryVotingEscrow.sol',
              r'    function withdraw\(\n        uint256 tokenId\n    \) external nonReentrant \{.*?\n    \}\n\n    function votingPower\(',
              '''    function withdraw(\n        uint256 tokenId\n    ) external nonReentrant {\n        if (ownerOf(tokenId) != msg.sender) {\n            revert NoLock();\n        }\n\n        Lock memory lock = locks[tokenId];\n        bool early = block.timestamp < lock.end;\n\n        _checkpointVotingPower(tokenId);\n\n        delete locks[tokenId];\n        delete lastVotingPowerCheckpoint[tokenId];\n\n        if (early) {\n            if (rewardsController == address(0)) {\n                revert RewardsControllerNotSet();\n            }\n\n            uint256 fee = (uint256(lock.amount) * EARLY_WITHDRAW_FEE_BPS) / BPS;\n            uint256 rewardShare = (fee * EARLY_WITHDRAW_REWARD_SHARE_BPS) / BPS;\n            uint256 treasuryShare = fee - rewardShare;\n            uint256 returnedAmount = uint256(lock.amount) - fee;\n\n            _burn(tokenId);\n\n            token.safeTransfer(address(rewardsController), rewardShare);\n            token.safeTransfer(treasury, treasuryShare);\n            token.safeTransfer(msg.sender, returnedAmount);\n            return;\n        }\n\n        _burn(tokenId);\n        token.safeTransfer(msg.sender, lock.amount);\n\n        emit Withdrawn(msg.sender, tokenId, lock.amount);\n    }\n\n    function votingPower(''')

          # RevenueRewards: remember owner on burn and accept claims from that owner.
          sub('contracts/governance/CentryVeCENTRevenueRewards.sol',
              r'(mapping\(uint256 => address\) public selfRepayRecipient;\n    mapping\(uint256 => address\) public selfRepayOwner;\n)',
              r'\1    mapping(uint256 => address) public withdrawnPositionOwner;\n')
          sub('contracts/governance/CentryVeCENTRevenueRewards.sol',
              r'        address owner = veCENT\.ownerOf\(tokenId\);',
              '        address owner = positionOwner(tokenId);')
          sub('contracts/governance/CentryVeCENTRevenueRewards.sol',
              r'        address owner = veCENT\.ownerOf\(tokenId\);',
              '        address owner = positionOwner(tokenId);')
          sub('contracts/governance/CentryVeCENTRevenueRewards.sol',
              r'(function claimForSelfRepay\(.*?\n\s*\) external nonReentrant returns \(uint256\) \{\n\s*)address owner = veCENT\.ownerOf\(tokenId\);',
              r'\1address owner = positionOwner(tokenId);', flags=re.S)
          sub('contracts/governance/CentryVeCENTRevenueRewards.sol',
              r'    function onVeCENTTransfer\(\n        uint256 tokenId,\n        address from,\n        address to\n    \) external override \{.*?\n    \}\n\n    function _claim\(',
              '''    function onVeCENTTransfer(\n        uint256 tokenId,\n        address from,\n        address to\n    ) external override {\n        if (msg.sender != address(veCENT)) {\n            revert TransferHookUnauthorized();\n        }\n\n        if (from == address(0) || from == to) {\n            return;\n        }\n\n        if (to == address(0)) {\n            withdrawnPositionOwner[tokenId] = from;\n            return;\n        }\n\n        if (selfRepayRecipient[tokenId] != address(0)) {\n            _clearSelfRepay(tokenId, from);\n        }\n\n        delete withdrawnPositionOwner[tokenId];\n    }\n\n    function positionOwner(\n        uint256 tokenId\n    ) public view returns (address owner) {\n        try veCENT.ownerOf(tokenId) returns (address activeOwner) {\n            return activeOwner;\n        } catch {\n            return withdrawnPositionOwner[tokenId];\n        }\n    }\n\n    function _claim(''', flags=re.S)

          # Executor: closed positions can still use self-repay.
          sub('contracts/core/CentrySelfRepayExecutorV2.sol',
              r'(function veCENT\(\) external view returns \(address\);\n\n)',
              r'\1    function positionOwner(uint256 tokenId) external view returns (address);\n\n')
          sub('contracts/core/CentrySelfRepayExecutorV2.sol',
              r'address borrower = veCENT\.ownerOf\(tokenId\);',
              'address borrower = rewardsController.positionOwner(tokenId);')

          # Frontend ABI + write action + governance UI.
          sub('frontend/constants/abis.js',
              r'(name: \'withdraw\',[\s\S]*?outputs: \[\],\n  \},\n)',
              r'''\1  {\n    type: 'function',\n    name: 'EARLY_WITHDRAW_FEE_BPS',\n    stateMutability: 'view',\n    inputs: [],\n    outputs: [{ type: 'uint256' }],\n  },\n''')
          sub('frontend/hooks/useVeGovernance.js',
              r'(  const extendLock = \(tokenId, weeks\) => sendAndWait\([\s\S]*?\n  \});\n)',
              r'''\1\n  const withdrawLock = (tokenId) => sendAndWait({\n    address: CONTRACT_ADDRESSES.veCentry,\n    abi: VE_CENTRY_ABI,\n    functionName: 'withdraw',\n    args: [tokenId],\n  });\n''')
          sub('frontend/hooks/useVeGovernance.js',
              r'(    extendLock,\n)(    refetchAll,\n)',
              r'\1    withdrawLock,\n\2')
          sub('frontend/app/app/governance/page.jsx',
              r'(  const extendPosition = async \(tokenId, currentWeeks\) => \{)',
              '''  const withdrawPosition = async (tokenId) => {\n    if (busyPosition) return;\n    if (!window.confirm('Early withdrawal returns 75% of locked CENT. The 25% fee is split 60% to RevenueRewards and 40% to treasury. Already-earned rewards remain claimable.')) return;\n    try {\n      setNotice('');\n      setBusyPosition(`withdraw-${tokenId}`);\n      await governance.withdrawLock(BigInt(tokenId));\n      await governance.refetchAll();\n      setNotice(`veCENT #${tokenId} withdrawn. Earned rewards remain claimable.`);\n    } catch (error) {\n      setNotice(error?.shortMessage || error?.message || 'Transaction failed.');\n    } finally {\n      setBusyPosition(null);\n    }\n  };\n\n\1''')
          sub('frontend/app/app/governance/page.jsx',
              r'(\n\s*)<div className="position-actions-grid">',
              r'''\1<div className="position-early-exit">\n\1  <div><span>Early exit</span><strong>25% fee · 75% returned</strong></div>\n\1  <button type="button" className="secondary-btn early-exit-btn" disabled={busyPosition !== null || position.weeksLeft <= 0} onClick={() => withdrawPosition(position.tokenId)}>\n\1    {busyPosition === `withdraw-${position.tokenId}` ? 'Working…' : 'Exit early'}\n\1  </button>\n\1</div>\n\1<div className="position-actions-grid">''', flags=0)
          sub('frontend/app/app/governance/page.jsx',
              r'(        \.position-actions-grid\{display:grid;grid-template-columns:repeat\(2,minmax\(0,1fr)\);gap:14px;margin-top:16px\}\n)',
              '''        .position-early-exit{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:13px 14px;border:1px solid #3a2a48;border-radius:11px;background:rgba(48,24,35,.34)}\n        .position-early-exit span{display:block;color:#8f849d;font-size:11px}.position-early-exit strong{display:block;margin-top:4px;font-size:13px}\n        .early-exit-btn{white-space:nowrap}\n\1''')

          doc = Path('contracts/REMIX_DEPLOYMENT.md')
          ds = doc.read_text()
          if '## Early withdrawal v2' not in ds:
              ds = ds.replace('## 1. Compiler\n', '''## Early withdrawal v2\n\nThe v2 veCENT escrow supports penalized early withdrawal: 25% of locked CENT is charged as a fee; 60% of the fee goes to RevenueRewards, 40% to treasury, and 75% of the principal returns to the user. Voting power becomes zero immediately and already-published rewards remain claimable by the withdrawn position owner.\n\nConstructor: `CentryVotingEscrow(token_, treasury_)`.\n\nThe v2 dependency chain is VotingEscrow -> RevenueRewards -> RevenueEngine -> RevenueToCENT adapter, with SelfRepayExecutorV2 also pointed at the new RevenueRewards.\n\n## 1. Compiler\n''', 1)
              doc.write_text(ds)
          print('early withdrawal v2 patch applied')
          PY

      - name: Verify
        run: |
          git diff --check
          grep -n "EARLY_WITHDRAW_FEE_BPS\|EARLY_WITHDRAW_REWARD_SHARE_BPS" contracts/governance/CentryVotingEscrow.sol
          grep -n "withdrawnPositionOwner\|function positionOwner" contracts/governance/CentryVeCENTRevenueRewards.sol
          grep -n "rewardsController.positionOwner" contracts/core/CentrySelfRepayExecutorV2.sol
          node --check frontend/hooks/useVeGovernance.js

      - name: Build frontend
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/governance/CentryVotingEscrow.sol contracts/governance/CentryVeCENTRevenueRewards.sol contracts/core/CentrySelfRepayExecutorV2.sol frontend/constants/abis.js frontend/hooks/useVeGovernance.js frontend/app/app/governance/page.jsx contracts/REMIX_DEPLOYMENT.md
          git commit -m "feat: add penalized early veCENT withdrawal"
          git push
