name: Final UI trim

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trim:
    if: ${{ !contains(github.event.head_commit.message, '[skip final ui trim]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove final dashboard network label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('frontend/app/app/page.jsx')
          text = dashboard.read_text()
          original = text
          text = re.sub(
              r'\n\s*<div><span>Status</span><strong className="status-live">Live</strong></div>\n\s*<div><span>Network</span><strong>Arc Testnet</strong></div>',
              '\n                <div><span>Status</span><strong className="status-live">Live</strong></div>',
              text,
              count=1,
          )
          dashboard.write_text(text)

          globals = Path('frontend/app/globals.css')
          text = globals.read_text()
          text = text.replace(
              'grid-template-columns: minmax(180px, 1.5fr) minmax(80px, 0.7fr) minmax(150px, 1fr) auto;',
              'grid-template-columns: minmax(180px, 1.5fr) minmax(80px, 0.7fr) auto;',
              1,
          )
          globals.write_text(text)

          # Remove unused styles left behind by the visual cleanup.
          def drop_rule(text, selector):
              pattern = rf'\n{re.escape(selector)}\\s*\\{{.*?\\}}'
              return re.sub(pattern, '', text, count=1, flags=re.S)

          for selector in ['.network-card', '.network-card small', '.network-card strong', '.network-dot', '.chain-id', '.section-kicker']:
              text = drop_rule(text, selector)
          globals.write_text(text)

          # Remove dead variables that were only used by the deleted reserve badge.
          lending = Path('frontend/components/MultiMarketLending.jsx')
          text = lending.read_text()
          text = re.sub(r'\n\s*const reserveStatus = lending\.reserveLoading.*?;\n', '\n', text, count=1, flags=re.S)
          lending.write_text(text)

          if 'Arc Testnet</strong>' in dashboard.read_text():
              raise SystemExit('Dashboard network label still present')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/globals.css frontend/app/app/page.jsx frontend/components/MultiMarketLending.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: remove final dashboard network label [skip final ui trim]"
          git push
