name: Generate security lockfiles
# Temporary lockfile generation workflow

on:
  push:
    branches:
      - security-lockfiles-temp

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles
        run: |
          if [ ! -f package-lock.json ] || [ ! -f frontend/package-lock.json ]; then
            echo "Expected lockfiles were not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json frontend/package-lock.json
          git commit -m "chore: add npm lockfiles"
          git push
