name: Centry Reward Epoch Queue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centry-reward-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Queue generated reward epoch
        env:
          ARC_RPC_URL_SECRET: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_VARIABLE: ${{ vars.ARC_RPC_URL }}
          CENTRY_REVENUE_REWARDS_OWNER_PRIVATE_KEY: ${{ secrets.CENTRY_REVENUE_REWARDS_OWNER_PRIVATE_KEY }}
          CENTRY_REVENUE_REWARDS: "0x06e627ce43F2ddd37e8f196824f7049416c3025b"
        run: npm run queue:reward-epoch
