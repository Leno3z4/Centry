name: Application CI
permissions:
  contents: read

# Build both Next.js surfaces so agent/API and agent UI changes are validated together.
on:
  push:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "package-lock.json"
      - "frontend/**"
      - ".github/workflows/application-ci.yml"
      - "agent-db/**"
      - "agent-runner/**"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "frontend/**"
      - ".github/workflows/application-ci.yml"
      - "agent-db/**"
      - "agent-runner/**"

jobs:
  root-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build root Next app
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  agent-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-db
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-db/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate worker syntax
        run: node --check src/index.js

  agent-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runner
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-runner/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate runner syntax
        run: npm run check
