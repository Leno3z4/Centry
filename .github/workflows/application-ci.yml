name: Application CI

# Build both Next.js surfaces so agent/API and agent UI changes are validated together.
on:
  push:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "frontend/**"
      - ".github/workflows/application-ci.yml"
      - "agent-db/**"
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "frontend/**"
      - ".github/workflows/application-ci.yml"

jobs:
  root-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build root Next app
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  agent-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-db/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate worker syntax
        run: node --check src/index.js
