name: Remove landing markets section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: ${{ !contains(github.event.head_commit.message, '[skip landing markets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean landing markets markup and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/components/WelcomePage.jsx')
          text = path.read_text()

          text = re.sub(r'\s*<a href="#markets">Markets</a>', '', text, count=1)
          text = re.sub(
              r'\n\s*<section id="markets" className="landing-market-section">.*?\n\s*</section>\n',
              '\n', text, count=1, flags=re.S
          )

          # Remove only leftover market-specific CSS rules/selectors.
          text = re.sub(r'\n\s*\.landing-market-section,?', '', text)
          text = re.sub(r'\n\s*\.landing-market-section \{[^}]*\}', '', text)
          text = re.sub(r'\n\s*\.landing-market-row \{[^}]*\}', '', text)
          text = re.sub(r'\n\s*\.landing-market-name \{[^}]*\}', '', text)
          text = re.sub(r'\n\s*\.landing-market-value \{[^}]*\}', '', text)
          text = re.sub(r'\n\s*\.landing-market-name strong \{[^}]*\}', '', text)
          text = re.sub(r'\n\s*\.landing-market-value strong \{[^}]*\}', '', text)

          # Repair the shared typography selector after removing market-specific entries.
          text = re.sub(
              r'\.landing-status,\n\s*\.landing-kicker,\n\s*\.landing-data-heading span,\n\s*\.landing-metric span,\n\s*\.landing-metric-note,?\s*\n\s*font-family:',
              '.landing-status,\n                .landing-kicker,\n                .landing-data-heading span,\n                .landing-metric span,\n                .landing-metric-note {\n                    font-family:',
              text,
          )

          if 'id="markets"' in text or 'landing-market-section' in text:
              raise SystemExit('Markets section cleanup verification failed')
          if 'landing-metric-note,\n                    font-family:' in text:
              raise SystemExit('Typography selector repair failed')

          path.write_text(text)
          PY
      - name: Verify and commit
        run: |
          if grep -n 'id="markets"\|landing-market-section' frontend/components/WelcomePage.jsx; then
            echo "Markets section still present"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/WelcomePage.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "refactor: finish landing markets removal [skip landing markets]"
          git push
