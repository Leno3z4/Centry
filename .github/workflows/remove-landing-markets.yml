name: Remove landing markets section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: ${{ !contains(github.event.head_commit.message, '[skip landing markets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove markets section from landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/components/WelcomePage.jsx')
          text = path.read_text()
          text = re.sub(r'\s*<a href="#markets">Markets</a>', '', text, count=1)
          text = re.sub(
              r'\n\s*<section id="markets" className="landing-market-section">.*?\n\s*</section>\n',
              '\n', text, count=1, flags=re.S
          )
          text = re.sub(r'\n\s*\.landing-market-section,', '', text)
          text = re.sub(
              r'\n\s*\.landing-market-section \{.*?\n\s*\.landing-governance-section',
              '\n\n                .landing-governance-section', text, count=1, flags=re.S
          )
          text = re.sub(r'\n\s*\.landing-market-section[^\n]*\n', '\n', text)
          text = re.sub(r'\n\s*\.landing-market-row[^\n]*\n', '\n', text)
          text = re.sub(r'\n\s*\.landing-market-name[^\n]*\n', '\n', text)
          text = re.sub(r'\n\s*\.landing-market-value[^\n]*\n', '\n', text)

          if 'id="markets"' in text or 'landing-market-section' in text:
              raise SystemExit('Markets cleanup verification failed')
          path.write_text(text)
          PY
      - name: Verify and commit
        run: |
          if grep -n 'id="markets"\|landing-market-section' frontend/components/WelcomePage.jsx; then
            echo "Markets section still present"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/WelcomePage.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "refactor: remove landing markets section [skip landing markets]"
          git push
