name: Centry Reward Epoch Activation

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

concurrency:
  group: centry-reward-epoch-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Activate reward epoch
        env:
          ARC_RPC_URL_SECRET: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_VARIABLE: ${{ vars.ARC_RPC_URL }}
          CENTRY_REVENUE_REWARDS_OWNER_PRIVATE_KEY: ${{ secrets.CENTRY_REVENUE_REWARDS_OWNER_PRIVATE_KEY }}
          CENTRY_REVENUE_REWARDS: "0x0cBb0050cDCCC5D9CE8Ee2C407c8608B042D30D5"
        run: npm run activate:reward-epoch
