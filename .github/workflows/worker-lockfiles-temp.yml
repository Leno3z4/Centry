name: Generate worker lockfiles
on:
  push:
    branches:
      - security-lockfiles-temp
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate agent-db lockfile
        working-directory: agent-db
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate agent-runner lockfile
        working-directory: agent-runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          if [ ! -f agent-db/package-lock.json ] || [ ! -f agent-runner/package-lock.json ]; then
            echo "Expected worker lockfiles were not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-db/package-lock.json agent-runner/package-lock.json
          if git diff --cached --quiet; then
            echo "Worker lockfiles already current."
            exit 0
          fi
          git commit -m "chore: add worker npm lockfiles"
          git push origin HEAD:security-lockfiles-temp

# trigger
