name: Solidity CI

on:
  push:
    paths:
      - "contracts/agents/**"
      - "contracts/agents/test/**"
      - "agent-foundry.toml"
      - ".gitmodules"
      - ".github/workflows/solidity-ci.yml"
  pull_request:
    paths:
      - "contracts/agents/**"
      - "contracts/agents/test/**"
      - "agent-foundry.toml"
      - ".gitmodules"
      - ".github/workflows/solidity-ci.yml"

jobs:
  onchain-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Test onchain agent foundation
        run: forge test --config-path agent-foundry.toml -vv
