name: Solidity CI
permissions:
  contents: read

on:
  push:
    paths:
      - "contracts/agents/**"
      - "contracts/agents/test/**"
      - "foundry.toml"
      - ".gitmodules"
      - ".github/workflows/solidity-ci.yml"
  pull_request:
    paths:
      - "contracts/agents/**"
      - "contracts/agents/test/**"
      - "foundry.toml"
      - ".gitmodules"
      - ".github/workflows/solidity-ci.yml"

jobs:
  onchain-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Test onchain agent foundation
        run: |
          cd contracts/agents
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "."
          test = "test"
          out = "out"
          cache_path = "cache"
          solc_version = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          via_ir = false
          allow_paths = [
            "../../lib/openzeppelin-contracts"
          ]
          remappings = [
            "@openzeppelin/=../../lib/openzeppelin-contracts/"
          ]
          EOF
          forge test -vv
