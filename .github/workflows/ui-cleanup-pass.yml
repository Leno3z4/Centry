name: UI cleanup pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip ui cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean decorative labels, network tags, and dashboard polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend')

          # Remove decorative section/eyebrow labels and small status badges
          # from JSX without touching functional form fields or transaction state.
          for path in root.rglob('*.jsx'):
              text = path.read_text()
              original = text

              text = re.sub(
                  r'\s*<span className="(?:section-kicker|landing-kicker)">.*?</span>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<div className="eyebrow">.*?</div>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<span className="landing-status">.*?</span>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<span className="landing-network">.*?</span>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<div className="landing-trust-row">.*?</div>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<span className="live-badge">.*?</span>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<div className="test-badge">.*?</div>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<span className=\{lending\.reserveActive \? \'live-badge\' : \'test-badge\'\}>\s*\{reserveStatus\}\s*</span>',
                  '', text, flags=re.S
              )
              text = re.sub(
                  r'\s*<span className="protocol-stats-live">.*?</span>',
                  '', text, flags=re.S
              )

              # Landing footer: keep the experimental-software note, drop the network tag.
              text = text.replace(
                  '<span>Arc Testnet · Experimental software</span>',
                  '<span>Experimental software</span>'
              )

              # Landing nav: move links to the right and make Open app a compact button.
              text = text.replace(
                  '<div className="landing-nav-links">\n                    <a href="#how-it-works">How it works</a>\n                    <a href="#governance">Governance</a>\n                    <Link href="/app">Open app</Link>\n                </div>',
                  '<div className="landing-nav-links">\n                    <a href="#how-it-works">How it works</a>\n                    <a href="#governance">Governance</a>\n                    <Link href="/app" className="landing-nav-app">Open app</Link>\n                </div>'
              )

              if path.as_posix() == 'frontend/components/AppShell.jsx':
                  text = text.replace("import { useAccount, useChainId } from 'wagmi';", "import { useAccount } from 'wagmi';")
                  text = text.replace('  const chainId = useChainId();\n', '')
                  text = text.replace(
                      '''\n        <div className="network-card">\n          <span className="network-dot" />\n          <div><small>Network</small><strong>Arc Testnet</strong></div>\n          <span className="chain-id">{chainId || 5042002}</span>\n        </div>''',
                      ''
                  )
                  text = text.replace('\n          <span>Arc Testnet</span>', '')

              path.write_text(text)

          # Remove now-unused decorative CSS declarations.
          globals = root / 'app/globals.css'
          if globals.exists():
              text = globals.read_text()
              text = re.sub(r'\n\.eyebrow\s*\{.*?\}\n\.eyebrow span\s*\{.*?\}\n', '\n', text, flags=re.S)
              text = re.sub(r'\n\.live-badge, \.test-badge\s*\{.*?\}\n\.live-badge i\s*\{.*?\}\n\.test-badge\s*\{.*?\}\n', '\n', text, flags=re.S)
              globals.write_text(text)

          typography = root / 'app/typography.css'
          if typography.exists():
              text = typography.read_text()
              text = re.sub(
                  r'\n/\* Small eyebrow/kicker labels.*?\*/\n\.eyebrow,\n\.section-kicker \{\n  display: none !important;\n\}\n',
                  '\n', text, flags=re.S
              )
              typography.write_text(text)

          # Landing-specific cleanup and navigation polish.
          welcome = root / 'components/WelcomePage.jsx'
          text = welcome.read_text()
          text = text.replace(
              'grid-template-columns: auto 1fr auto;',
              'grid-template-columns: auto 1fr;'
          )
          text = text.replace(
              '                .landing-nav-links {\n                    justify-self: center;',
              '                .landing-nav-links {\n                    justify-self: end;'
          )
          text = text.replace(
              '                    margin: 20px 0 18px;',
              '                    margin: 0 0 18px;'
          )
          text = text.replace(
              '                .landing-network,\n                .landing-status,\n                .landing-kicker,\n                .landing-data-heading span,\n                .landing-metric span,\n                .landing-metric-note {',
              '                .landing-metric span,\n                .landing-metric-note {'
          )
          text = text.replace(
              '                .landing-network { color: #9b8da8; font-size: 9px; white-space: nowrap; }\n\n',
              ''
          )
          text = text.replace(
              '''                .landing-status {\n                    display: inline-flex;\n                    align-items: center;\n                    gap: 8px;\n                    color: #b09bc7;\n                    font-size: 9px;\n                }\n\n                .landing-status i {\n                    width: 6px;\n                    height: 6px;\n                    border-radius: 50%;\n                    background: var(--green);\n                    box-shadow: 0 0 12px var(--green);\n                }\n\n''',
              ''
          )
          text = text.replace(
              '                .landing-kicker { color: #987db9; font-size: 9px; }\n',
              ''
          )
          text = re.sub(r'\n\s*\.landing-trust-row\s*\{.*?\}', '', text, flags=re.S)
          text = text.replace(
              '                .landing-network,\n                .landing-status,\n',
              ''
          )

          # Add the compact Open app button style.
          marker = "                .landing-nav-links a:hover { color: #fff; }\n"
          if marker in text and '.landing-nav-app {' not in text:
              text = text.replace(
                  marker,
                  marker + "\n                .landing-nav-app { padding: 8px 13px; border: 1px solid rgba(161, 128, 193, .32); border-radius: 999px; color: #eee7f3 !important; background: rgba(109, 71, 145, .16); }\n                .landing-nav-app:hover { border-color: rgba(190, 157, 222, .5); background: rgba(109, 71, 145, .26); }\n"
              )
          welcome.write_text(text)

          # Dashboard: reuse the landing AeroShards field as a subtle page-wide backdrop.
          dashboard = root / 'app/app/page.jsx'
          text = dashboard.read_text()
          if "import dynamic from 'next/dynamic';" not in text:
              text = text.replace(
                  "import { useEffect, useMemo, useState } from 'react';",
                  "import dynamic from 'next/dynamic';\nimport { useEffect, useMemo, useState } from 'react';"
              )
          if "const AeroShards = dynamic(() => import('../../components/AeroShards')" not in text:
              insert_after = "import { useVeGovernance } from '../../hooks/useVeGovernance';\n"
              block = "\nconst AeroShards = dynamic(() => import('../../components/AeroShards'), { ssr: false, loading: () => null });\n"
              text = text.replace(insert_after, insert_after + block)
          if 'className="overview-aero-background"' not in text:
              text = text.replace(
                  '    <div className="page-stack">\n',
                  '''    <div className="page-stack">\n      <div className="overview-aero-background" aria-hidden="true">\n        <AeroShards\n          backgroundColor="#120F17"\n          shardColor="#896ABD"\n          accentColor="#A855F7"\n          placement="full"\n          flow="stream"\n          material="pearl"\n          detail="balanced"\n          effect="none"\n          scale={1}\n          spread={1}\n          depth={1}\n          speed={1}\n          spin={1}\n          interaction="repel"\n          density={1.5}\n          shardSize={1.1}\n          stretch={1}\n          turbulence={1}\n          glow={1}\n          edgeSoftness={2}\n          bloom={0.5}\n          grain={0.05}\n          chromaticAberration={0.0075}\n          transitionDuration={1}\n          interactionRadius={1.5}\n          interactionStrength={0.5}\n          rippleIntensity={1}\n          holdToGather={true}\n        />\n      </div>\n'''
              )
          if '.overview-aero-background' not in text[text.find('<style jsx global>'):]:
              marker = '      <style jsx global>{`\n'
              styles = '''        .page-stack{position:relative;isolation:isolate}\n        .overview-aero-background{position:fixed;inset:0;z-index:0;opacity:.10;pointer-events:none;overflow:hidden}\n        .overview-aero-background > *{width:100%;height:100%}\n        .page-stack > :not(.overview-aero-background){position:relative;z-index:1}\n'''
              text = text.replace(marker, marker + styles)
          # Remove decorative section labels that may be on this page but preserve useful data labels/status.
          dashboard.write_text(text)

          # Verification: these decorative tags should no longer exist in rendered JSX.
          leftovers = []
          for path in root.rglob('*.jsx'):
              text = path.read_text()
              for token in ('section-kicker', 'landing-kicker', 'className="eyebrow"', 'className="live-badge"', 'className="test-badge"', 'className="landing-status"', 'className="landing-network"'):
                  if token in text:
                      leftovers.append(f'{path}: {token}')
          if leftovers:
              print('\n'.join(leftovers))
              raise SystemExit('Decorative UI cleanup verification failed')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "refactor: simplify ui chrome and add dashboard atmosphere [skip ui cleanup]"
          git push
