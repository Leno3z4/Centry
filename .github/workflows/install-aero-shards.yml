name: Install AeroShards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[skip aero-shards]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install AeroShards from React Bits registry
        working-directory: frontend
        env:
          REGISTRY_URL: https://reactbits.dev/r/AeroShards-JS-CSS.json
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          const url = process.env.REGISTRY_URL;

          function fetchJson(target) {
            return new Promise((resolve, reject) => {
              https.get(target, response => {
                if (response.statusCode >= 300 && response.statusCode < 400 && response.headers.location) {
                  response.resume();
                  resolve(fetchJson(new URL(response.headers.location, target).href));
                  return;
                }
                if (response.statusCode !== 200) {
                  response.resume();
                  reject(new Error(`Registry request failed: HTTP ${response.statusCode}`));
                  return;
                }
                let body = '';
                response.setEncoding('utf8');
                response.on('data', chunk => { body += chunk; });
                response.on('end', () => {
                  try { resolve(JSON.parse(body)); } catch (error) { reject(error); }
                });
              }).on('error', reject);
            });
          }

          (async () => {
            const registry = await fetchJson(url);
            for (const file of registry.files ?? []) {
              const target = file.target
                .replace(/^@components\//, 'components/');
              const destination = path.resolve(process.cwd(), target);
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, file.content, 'utf8');
              console.log(`wrote ${target}`);
            }

            const packagePath = path.resolve(process.cwd(), 'package.json');
            const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            const dependencies = [
              ...(registry.dependencies ?? []),
              ...(registry.devDependencies ?? []),
            ];
            packageJson.dependencies ??= {};
            for (const dependency of dependencies) {
              if (!packageJson.dependencies[dependency]) {
                packageJson.dependencies[dependency] = 'latest';
              }
            }
            fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          npm install --package-lock=false

      - name: Commit installed component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "AeroShards already installed; nothing to commit."
            exit 0
          fi
          git add frontend/components/AeroShards.jsx frontend/components/AeroShards.css frontend/package.json
          git commit -m "feat: install AeroShards [skip aero-shards]"
          git push
