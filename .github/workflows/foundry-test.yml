name: Foundry Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify OpenZeppelin dependency
        run: |
          test -f lib/openzeppelin-contracts/contracts/access/Ownable.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC20/IERC20.sol

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: forge install --no-commit

      - name: Run liquidation test
        run: forge test --match-contract CentryLendingPoolLiquidationTest -vv
