name: Foundry Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Populate OpenZeppelin v5.4.0 dependency
        run: |
          rm -rf lib/openzeppelin-contracts
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts

      - name: Normalize OpenZeppelin imports for Foundry
        run: |
          find contracts -type f -name '*.sol' -print0 | xargs -0 sed -i 's#https://raw.githubusercontent.com/OpenZeppelin/openzeppelin-contracts/v5.4.0/contracts/#@openzeppelin/#g'

      - name: Verify OpenZeppelin dependency
        run: |
          test -f lib/openzeppelin-contracts/contracts/access/Ownable.sol
          test -f lib/openzeppelin-contracts/contracts/access/Ownable2Step.sol
          test -f lib/openzeppelin-contracts/contracts/token/ERC20/IERC20.sol
          test -f lib/openzeppelin-contracts/contracts/utils/ReentrancyGuard.sol

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Run liquidation test
        run: forge test --match-contract CentryLendingPoolLiquidationTest -vv

      - name: Run UnitFlow V3 adapter tests
        run: forge test --match-contract CentryUnitFlowAdapterTest -vv
