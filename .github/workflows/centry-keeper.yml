name: Centry V2 Self-Repay Keeper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: centry-v2-self-repay-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ethers
        run: npm install --no-save ethers@6

      - name: Run Centry V2 keeper
        env:
          ARC_RPC_URL_SECRET: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_VARIABLE: ${{ vars.ARC_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}

          CENTRY_VECENT: "0xF8B71bAed42c28e7e376C4DbD4A137047B92a503"
          CENTRY_REVENUE_REWARDS: "0x06e627ce43F2ddd37e8f196824f7049416c3025b"
          CENTRY_SELF_REPAY_EXECUTOR: "0x02356D1E4557b8D656cE1493D751C914EA84efe7"
          CENTRY_LENDING_POOL: "0x90C935687D91b3352b2C55cd79389C92950D94BD"

          CENTRY_REWARD_MANIFEST_URL_SECRET: ${{ secrets.CENTRY_REWARD_MANIFEST_URL }}
          CENTRY_REWARD_MANIFEST_URL_VARIABLE: ${{ vars.CENTRY_REWARD_MANIFEST_URL }}

          CENTRY_MAX_TOKEN_SCAN_SECRET: ${{ secrets.CENTRY_MAX_TOKEN_SCAN }}
          CENTRY_MAX_TOKEN_SCAN_VARIABLE: ${{ vars.CENTRY_MAX_TOKEN_SCAN }}

          CENTRY_MIN_NATIVE_BALANCE_SECRET: ${{ secrets.CENTRY_MIN_NATIVE_BALANCE }}
          CENTRY_MIN_NATIVE_BALANCE_VARIABLE: ${{ vars.CENTRY_MIN_NATIVE_BALANCE }}

        run: |
          node <<'NODE'
          const { ethers } = require('ethers');

          const RPC_URL =
            process.env.ARC_RPC_URL_SECRET ||
            process.env.ARC_RPC_URL_VARIABLE;

          const PRIVATE_KEY =
            process.env.KEEPER_PRIVATE_KEY;

          const VECENT =
            process.env.CENTRY_VECENT;

          const REWARDS =
            process.env.CENTRY_REVENUE_REWARDS;

          const EXECUTOR =
            process.env.CENTRY_SELF_REPAY_EXECUTOR;

          const LENDING_POOL =
            process.env.CENTRY_LENDING_POOL;

          const MANIFEST_URL =
            process.env.CENTRY_REWARD_MANIFEST_URL_SECRET ||
            process.env.CENTRY_REWARD_MANIFEST_URL_VARIABLE;

          const MAX_TOKEN_SCAN = BigInt(
            process.env.CENTRY_MAX_TOKEN_SCAN_SECRET ||
            process.env.CENTRY_MAX_TOKEN_SCAN_VARIABLE ||
            '1000'
          );

          const MIN_NATIVE_BALANCE = BigInt(
            process.env.CENTRY_MIN_NATIVE_BALANCE_SECRET ||
            process.env.CENTRY_MIN_NATIVE_BALANCE_VARIABLE ||
            '1000000000000000'
          );

          const EXPECTED_CHAIN_ID = 5042002n;

          const required = [
            ['ARC_RPC_URL', RPC_URL],
            ['KEEPER_PRIVATE_KEY', PRIVATE_KEY],
            ['CENTRY_REWARD_MANIFEST_URL', MANIFEST_URL]
          ];

          const missing = required
            .filter(([, value]) => !value)
            .map(([name]) => name);

          if (missing.length > 0) {
            throw new Error(
              `Missing keeper configuration: ${missing.join(', ')}`
            );
          }

          for (const [name, address] of [
            ['CENTRY_VECENT', VECENT],
            ['CENTRY_REVENUE_REWARDS', REWARDS],
            ['CENTRY_SELF_REPAY_EXECUTOR', EXECUTOR],
            ['CENTRY_LENDING_POOL', LENDING_POOL]
          ]) {
            if (!ethers.isAddress(address)) {
              throw new Error(`${name} is not a valid address`);
            }
          }

          const provider = new ethers.JsonRpcProvider(RPC_URL);
          const wallet = new ethers.Wallet(PRIVATE_KEY, provider);

          const veCENT = new ethers.Contract(
            VECENT,
            [
              'function nextTokenId() view returns (uint256)',
              'function ownerOf(uint256 tokenId) view returns (address)'
            ],
            provider
          );

          const rewards = new ethers.Contract(
            REWARDS,
            [
              'function rewardToken() view returns (address)',
              'function veCENT() view returns (address)',
              'function epochRoots(uint256 epoch) view returns (bytes32)',
              'function latestEpoch() view returns (uint256)',
              'function selfRepayRecipient(uint256 tokenId) view returns (address)',
              'function selfRepayOwner(uint256 tokenId) view returns (address)',
              'function claimed(uint256 epoch, uint256 tokenId) view returns (bool)'
            ],
            provider
          );

          const lendingPool = new ethers.Contract(
            LENDING_POOL,
            [
              'function borrowBalance(address borrower, address asset) view returns (uint256)'
            ],
            provider
          );

          const executor = new ethers.Contract(
            EXECUTOR,
            [
              'function isKeeper(address keeper) view returns (bool)',
              'function swapAdapter() view returns (address)',
              'function supportedDebtAsset(address asset) view returns (bool)',
              'function executeSelfRepay(uint256 epoch, uint256 tokenId, uint256 rewardAmount, bytes32[] rewardProof, tuple(address debtAsset,uint256 rewardAmountIn,uint256 minDebtAssetOut,bytes swapData)[] instructions)'
            ],
            wallet
          );

          function normalizeAddress(value, label) {
            if (!ethers.isAddress(value)) {
              throw new Error(`${label} is not a valid address: ${value}`);
            }

            return ethers.getAddress(value);
          }

          function isMeaningfulHex(value) {
            return typeof value === 'string' &&
              value.startsWith('0x') &&
              value.length % 2 === 0;
          }

          function assertBytes32(value, label) {
            if (
              typeof value !== 'string' ||
              !/^0x[0-9a-fA-F]{64}$/.test(value)
            ) {
              throw new Error(
                `${label} must be a 32-byte hex value`
              );
            }
          }

          function parseManifestPayload(payload) {
            if (payload && typeof payload === 'object') {
              return payload;
            }

            if (typeof payload === 'string') {
              return JSON.parse(payload);
            }

            throw new Error('Reward manifest is not a JSON object');
          }

          async function fetchManifest(url) {
            const response = await fetch(url, {
              headers: {
                accept: 'application/json'
              }
            });

            if (!response.ok) {
              throw new Error(
                `Reward manifest request failed: ${response.status} ${response.statusText}`
              );
            }

            return parseManifestPayload(await response.json());
          }

          function validateManifestShape(manifest) {
            if (
              !manifest ||
              typeof manifest !== 'object'
            ) {
              throw new Error('Invalid reward manifest');
            }

            if (
              !Number.isInteger(manifest.epoch) &&
              typeof manifest.epoch !== 'string'
            ) {
              throw new Error('Manifest epoch is missing');
            }

            if (!Array.isArray(manifest.positions)) {
              throw new Error(
                'Manifest positions array is missing'
              );
            }

            for (const position of manifest.positions) {
              if (!position || typeof position !== 'object') {
                throw new Error('Invalid manifest position');
              }

              if (
                position.tokenId === undefined ||
                position.amount === undefined
              ) {
                throw new Error(
                  'Manifest position requires tokenId and amount'
                );
              }

              if (!Array.isArray(position.proof)) {
                throw new Error(
                  `Manifest proof missing for tokenId ${position.tokenId}`
                );
              }

              for (const proofItem of position.proof) {
                assertBytes32(
                  proofItem,
                  `proof for tokenId ${position.tokenId}`
                );
              }

              if (!Array.isArray(position.instructions)) {
                throw new Error(
                  `Manifest instructions missing for tokenId ${position.tokenId}`
                );
              }

              for (const instruction of position.instructions) {
                if (
                  !instruction ||
                  typeof instruction !== 'object'
                ) {
                  throw new Error(
                    `Invalid swap instruction for tokenId ${position.tokenId}`
                  );
                }

                normalizeAddress(
                  instruction.debtAsset,
                  `debtAsset for tokenId ${position.tokenId}`
                );

                if (
                  instruction.rewardAmountIn === undefined ||
                  instruction.minDebtAssetOut === undefined
                ) {
                  throw new Error(
                    `Swap instruction missing amounts for tokenId ${position.tokenId}`
                  );
                }

                if (!isMeaningfulHex(instruction.swapData || '0x')) {
                  throw new Error(
                    `swapData for tokenId ${position.tokenId} is invalid`
                  );
                }
              }
            }
          }

          function toBigInt(value, label) {
            try {
              return BigInt(value);
            } catch {
              throw new Error(
                `${label} is not a valid integer`
              );
            }
          }

          async function main() {
            const network = await provider.getNetwork();

            console.log(
              `Connected chainId: ${network.chainId.toString()}`
            );

            if (network.chainId !== EXPECTED_CHAIN_ID) {
              throw new Error(
                `Wrong network: expected Arc Testnet (${EXPECTED_CHAIN_ID}), got ${network.chainId}`
              );
            }

            console.log(
              `Keeper address: ${wallet.address}`
            );

            const nativeBalance =
              await provider.getBalance(wallet.address);

            console.log(
              `Keeper gas balance: ${ethers.formatEther(nativeBalance)} native`
            );

            if (nativeBalance < MIN_NATIVE_BALANCE) {
              throw new Error(
                'Keeper native balance is below configured minimum'
              );
            }

            const keeperAllowed =
              await executor.isKeeper(wallet.address);

            if (!keeperAllowed) {
              throw new Error(
                `Keeper ${wallet.address} is not authorized on SelfRepayExecutorV2`
              );
            }

            const configuredAdapter =
              await executor.swapAdapter();

            if (!ethers.isAddress(configuredAdapter) ||
              configuredAdapter === ethers.ZeroAddress) {
              throw new Error(
                'SelfRepayExecutorV2 has no swap adapter configured'
              );
            }

            const rewardsToken =
              await rewards.rewardToken();

            const rewardsVeCENT =
              await rewards.veCENT();

            if (
              ethers.getAddress(rewardsVeCENT) !==
              ethers.getAddress(VECENT)
            ) {
              throw new Error(
                'RevenueRewards.veCENT() does not match configured veCENT'
              );
            }

            console.log(
              `Reward token: ${rewardsToken}`
            );

            console.log(
              `Swap adapter: ${configuredAdapter}`
            );

            const manifest = await fetchManifest(MANIFEST_URL);

            validateManifestShape(manifest);

            const epoch = toBigInt(
              manifest.epoch,
              'manifest epoch'
            );

            const onChainLatestEpoch =
              await rewards.latestEpoch();

            console.log(
              `Manifest epoch: ${epoch.toString()}`
            );

            console.log(
              `On-chain latest epoch: ${onChainLatestEpoch.toString()}`
            );

            if (epoch > onChainLatestEpoch) {
              throw new Error(
                'Manifest epoch is not activated on-chain'
              );
            }

            const onChainRoot =
              await rewards.epochRoots(epoch);

            if (
              onChainRoot === ethers.ZeroHash
            ) {
              throw new Error(
                `No active Merkle root for epoch ${epoch}`
              );
            }

            if (
              manifest.root &&
              manifest.root.toLowerCase() !==
              onChainRoot.toLowerCase()
            ) {
              throw new Error(
                'Manifest root does not match on-chain epoch root'
              );
            }

            let scanned = 0n;
            let eligible = 0;
            let skipped = 0;

            const nextTokenId =
              await veCENT.nextTokenId();

            console.log(
              `veCENT nextTokenId: ${nextTokenId.toString()}`
            );

            const upperBound =
              nextTokenId < MAX_TOKEN_SCAN + 1n
                ? nextTokenId
                : MAX_TOKEN_SCAN + 1n;

            const manifestByTokenId =
              new Map();

            for (const position of manifest.positions) {
              const tokenId =
                toBigInt(
                  position.tokenId,
                  'manifest tokenId'
                );

              manifestByTokenId.set(
                tokenId.toString(),
                position
              );
            }

            for (
              let tokenId = 1n;
              tokenId < upperBound;
              tokenId++
            ) {
              scanned++;

              const position =
                manifestByTokenId.get(
                  tokenId.toString()
                );

              if (!position) {
                continue;
              }

              let owner;

              try {
                owner =
                  await veCENT.ownerOf(tokenId);
              } catch {
                console.log(
                  `tokenId ${tokenId}: does not exist, skipping`
                );
                skipped++;
                continue;
              }

              if (
                !owner ||
                owner === ethers.ZeroAddress
              ) {
                skipped++;
                continue;
              }

              const selfRepayRecipient =
                await rewards.selfRepayRecipient(
                  tokenId
                );

              const selfRepayOwner =
                await rewards.selfRepayOwner(
                  tokenId
                );

              if (
                selfRepayRecipient === ethers.ZeroAddress ||
                ethers.getAddress(selfRepayOwner) !==
                ethers.getAddress(owner)
              ) {
                console.log(
                  `tokenId ${tokenId}: self-repay not configured for current owner, skipping`
                );
                skipped++;
                continue;
              }

              if (
                ethers.getAddress(
                  selfRepayRecipient
                ) !==
                ethers.getAddress(
                  EXECUTOR
                )
              ) {
                console.log(
                  `tokenId ${tokenId}: self-repay recipient is not executor, skipping`
                );
                skipped++;
                continue;
              }

              const alreadyClaimed =
                await rewards.claimed(
                  epoch,
                  tokenId
                );

              if (alreadyClaimed) {
                console.log(
                  `tokenId ${tokenId}: epoch allocation already claimed, skipping`
                );
                skipped++;
                continue;
              }

              const rewardAmount =
                toBigInt(
                  position.amount,
                  `reward amount for tokenId ${tokenId}`
                );

              if (rewardAmount <= 0n) {
                console.log(
                  `tokenId ${tokenId}: reward amount is zero, skipping`
                );
                skipped++;
                continue;
              }

              const instructions = [];

              for (
                const rawInstruction of
                position.instructions
              ) {
                const debtAsset =
                  normalizeAddress(
                    rawInstruction.debtAsset,
                    'debtAsset'
                  );

                const supported =
                  await executor.supportedDebtAsset(
                    debtAsset
                  );

                if (!supported) {
                  console.log(
                    `tokenId ${tokenId}: debt asset ${debtAsset} is not supported, skipping entire position`
                  );
                  instructions.length = 0;
                  break;
                }

                const debt =
                  await lendingPool.borrowBalance(
                    owner,
                    debtAsset
                  );

                if (debt === 0n) {
                  continue;
                }

                const rewardAmountIn =
                  toBigInt(
                    rawInstruction.rewardAmountIn,
                    'rewardAmountIn'
                  );

                const minDebtAssetOut =
                  toBigInt(
                    rawInstruction.minDebtAssetOut,
                    'minDebtAssetOut'
                  );

                if (
                  rewardAmountIn <= 0n ||
                  minDebtAssetOut <= 0n
                ) {
                  continue;
                }

                instructions.push({
                  debtAsset,
                  rewardAmountIn,
                  minDebtAssetOut,
                  swapData:
                    rawInstruction.swapData || '0x'
                });
              }

              if (instructions.length === 0) {
                console.log(
                  `tokenId ${tokenId}: no executable debt instructions, skipping`
                );
                skipped++;
                continue;
              }

              const totalInput =
                instructions.reduce(
                  (sum, item) =>
                    sum + item.rewardAmountIn,
                  0n
                );

              if (totalInput > rewardAmount) {
                console.log(
                  `tokenId ${tokenId}: instruction inputs exceed reward allocation, skipping`
                );
                skipped++;
                continue;
              }

              console.log(
                `tokenId ${tokenId}: owner=${owner}, reward=${rewardAmount.toString()}, instructions=${instructions.length}`
              );

              const populated =
                await executor.executeSelfRepay.populateTransaction(
                  epoch,
                  tokenId,
                  rewardAmount,
                  position.proof,
                  instructions
                );

              const gasEstimate =
                await provider.estimateGas({
                  ...populated,
                  from: wallet.address
                });

              const feeData =
                await provider.getFeeData();

              const overrides = {
                gasLimit:
                  gasEstimate * 120n / 100n
              };

              if (feeData.maxFeePerGas) {
                overrides.maxFeePerGas =
                  feeData.maxFeePerGas;

                overrides.maxPriorityFeePerGas =
                  feeData.maxPriorityFeePerGas ?? 0n;
              } else if (feeData.gasPrice) {
                overrides.gasPrice =
                  feeData.gasPrice;
              }

              const tx =
                await executor.executeSelfRepay(
                  epoch,
                  tokenId,
                  rewardAmount,
                  position.proof,
                  instructions,
                  overrides
                );

              console.log(
                `tokenId ${tokenId}: submitted ${tx.hash}`
              );

              const receipt =
                await tx.wait();

              console.log(
                `tokenId ${tokenId}: confirmed in block ${receipt.blockNumber}`
              );

              eligible++;
            }

            console.log(
              `V2 keeper summary: scanned=${scanned}, executed=${eligible}, skipped=${skipped}`
            );
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
