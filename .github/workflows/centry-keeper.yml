name: Centry V2 Self-Repay Keeper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: centry-v2-self-repay-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ethers
        run: |
          npm install --no-save ethers@6

      - name: Validate reward manifest
        env:
          ARC_RPC_URL_SECRET: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_VARIABLE: ${{ vars.ARC_RPC_URL }}
        run: |
          node scripts/validate-reward-manifest.js

      - name: Run Centry V2 keeper
        env:
          ARC_RPC_URL_SECRET: ${{ secrets.ARC_RPC_URL }}
          ARC_RPC_URL_VARIABLE: ${{ vars.ARC_RPC_URL }}

          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}

          CENTRY_VECENT: "0xF8B71bAed42c28e7e376C4DbD4A137047B92a503"

          CENTRY_REVENUE_REWARDS: "0x06e627ce43F2ddd37e8f196824f7049416c3025b"

          CENTRY_SELF_REPAY_EXECUTOR: "0x02356D1E4557b8D656cE1493D751C914EA84efe7"

          CENTRY_LENDING_POOL: "0x90C935687D91b3352b2C55cd79389C92950D94BD"

          CENTRY_MAX_TOKEN_SCAN: ${{ vars.CENTRY_MAX_TOKEN_SCAN || '1000' }}

          CENTRY_MIN_NATIVE_BALANCE: ${{ vars.CENTRY_MIN_NATIVE_BALANCE || '0.001' }}

        run: |
          node <<'NODE'
          const fs = require("fs");
          const { ethers } = require("ethers");

          const RPC_URL =
            process.env.ARC_RPC_URL_SECRET ||
            process.env.ARC_RPC_URL_VARIABLE;

          const PRIVATE_KEY =
            process.env.KEEPER_PRIVATE_KEY;

          const VECENT =
            process.env.CENTRY_VECENT;

          const REWARDS =
            process.env.CENTRY_REVENUE_REWARDS;

          const EXECUTOR =
            process.env.CENTRY_SELF_REPAY_EXECUTOR;

          const LENDING_POOL =
            process.env.CENTRY_LENDING_POOL;

          const MANIFEST_PATH =
            "keeper/reward-manifest.json";

          const MAX_TOKEN_SCAN =
            BigInt(
              process.env.CENTRY_MAX_TOKEN_SCAN ||
              "1000"
            );

          const MIN_NATIVE_BALANCE =
            ethers.parseEther(
              process.env.CENTRY_MIN_NATIVE_BALANCE ||
              "0.001"
            );

          const EXPECTED_CHAIN_ID =
            5042002n;

          if (!RPC_URL) {
            throw new Error(
              "Missing ARC_RPC_URL"
            );
          }

          if (!PRIVATE_KEY) {
            throw new Error(
              "Missing KEEPER_PRIVATE_KEY"
            );
          }

          const addresses = [
            [
              "CENTRY_VECENT",
              VECENT
            ],
            [
              "CENTRY_REVENUE_REWARDS",
              REWARDS
            ],
            [
              "CENTRY_SELF_REPAY_EXECUTOR",
              EXECUTOR
            ],
            [
              "CENTRY_LENDING_POOL",
              LENDING_POOL
            ]
          ];

          for (const [
            name,
            address
          ] of addresses) {
            if (!ethers.isAddress(address)) {
              throw new Error(
                `${name} is not a valid address`
              );
            }
          }

          if (
            !fs.existsSync(
              MANIFEST_PATH
            )
          ) {
            throw new Error(
              `${MANIFEST_PATH} does not exist`
            );
          }

          const manifest =
            JSON.parse(
              fs.readFileSync(
                MANIFEST_PATH,
                "utf8"
              )
            );

          const provider =
            new ethers.JsonRpcProvider(
              RPC_URL
            );

          const wallet =
            new ethers.Wallet(
              PRIVATE_KEY,
              provider
            );

          const veCENT =
            new ethers.Contract(
              VECENT,
              [
                "function nextTokenId() view returns (uint256)",

                "function ownerOf(uint256 tokenId) view returns (address)"
              ],
              provider
            );

          const rewards =
            new ethers.Contract(
              REWARDS,
              [
                "function rewardToken() view returns (address)",

                "function veCENT() view returns (address)",

                "function epochRoots(uint256 epoch) view returns (bytes32)",

                "function latestEpoch() view returns (uint256)",

                "function selfRepayRecipient(uint256 tokenId) view returns (address)",

                "function selfRepayOwner(uint256 tokenId) view returns (address)",

                "function claimed(uint256 epoch, uint256 tokenId) view returns (bool)"
              ],
              provider
            );

          const lendingPool =
            new ethers.Contract(
              LENDING_POOL,
              [
                "function borrowBalance(address borrower, address asset) view returns (uint256)"
              ],
              provider
            );

          const executor =
            new ethers.Contract(
              EXECUTOR,
              [
                "function isKeeper(address keeper) view returns (bool)",

                "function swapAdapter() view returns (address)",

                "function supportedDebtAsset(address asset) view returns (bool)",

                "function executeSelfRepay(uint256 epoch,uint256 tokenId,uint256 rewardAmount,bytes32[] rewardProof,tuple(address debtAsset,uint256 rewardAmountIn,uint256 minDebtAssetOut,bytes swapData)[] instructions)"
              ],
              wallet
            );

          const network =
            await provider.getNetwork();

          console.log(
            `Connected chain ID: ${network.chainId.toString()}`
          );

          if (
            network.chainId !==
            EXPECTED_CHAIN_ID
          ) {
            throw new Error(
              `Wrong network. Expected Arc Testnet ${EXPECTED_CHAIN_ID}, got ${network.chainId}`
            );
          }

          console.log(
            `Keeper wallet: ${wallet.address}`
          );

          const nativeBalance =
            await provider.getBalance(
              wallet.address
            );

          console.log(
            `Keeper gas balance: ${ethers.formatEther(nativeBalance)}`
          );

          if (
            nativeBalance <
            MIN_NATIVE_BALANCE
          ) {
            throw new Error(
              "Keeper native balance is below configured minimum"
            );
          }

          const keeperAuthorized =
            await executor.isKeeper(
              wallet.address
            );

          if (!keeperAuthorized) {
            throw new Error(
              "Keeper wallet is not authorized on SelfRepayExecutorV2"
            );
          }

          const adapter =
            await executor.swapAdapter();

          if (
            adapter === ethers.ZeroAddress
          ) {
            throw new Error(
              "SelfRepayExecutorV2 has no swap adapter configured"
            );
          }

          console.log(
            `Swap adapter: ${adapter}`
          );

          const rewardsVeCENT =
            await rewards.veCENT();

          if (
            ethers.getAddress(
              rewardsVeCENT
            ) !==
            ethers.getAddress(
              VECENT
            )
          ) {
            throw new Error(
              "RevenueRewards.veCENT() does not match configured veCENT"
            );
          }

          const manifestEpoch =
            BigInt(
              manifest.epoch
            );

          const latestEpoch =
            await rewards.latestEpoch();

          console.log(
            `Manifest epoch: ${manifestEpoch.toString()}`
          );

          console.log(
            `Latest active epoch: ${latestEpoch.toString()}`
          );

          if (
            manifestEpoch >
            latestEpoch
          ) {
            throw new Error(
              "Manifest epoch is not active yet"
            );
          }

          const onChainRoot =
            await rewards.epochRoots(
              manifestEpoch
            );

          if (
            onChainRoot === ethers.ZeroHash
          ) {
            throw new Error(
              "Manifest epoch has no active Merkle root"
            );
          }

          if (
            manifest.root &&
            manifest.root.toLowerCase() !==
            onChainRoot.toLowerCase()
          ) {
            throw new Error(
              "Manifest root does not match on-chain root"
            );
          }

          const nextTokenId =
            await veCENT.nextTokenId();

          const upperBound =
            nextTokenId <
            MAX_TOKEN_SCAN + 1n
              ? nextTokenId
              : MAX_TOKEN_SCAN + 1n;

          console.log(
            `veCENT next token ID: ${nextTokenId.toString()}`
          );

          console.log(
            `Keeper scan upper bound: ${upperBound.toString()}`
          );

          let executed = 0;

          let skipped = 0;

          for (
            const position of
            manifest.positions
          ) {
            const tokenId =
              BigInt(
                position.tokenId
              );

            if (
              tokenId <= 0n ||
              tokenId >= upperBound
            ) {
              skipped++;

              continue;
            }

            let owner;

            try {
              owner =
                await veCENT.ownerOf(
                  tokenId
                );
            } catch {
              console.log(
                `tokenId ${tokenId}: NFT does not exist`
              );

              skipped++;

              continue;
            }

            if (
              owner === ethers.ZeroAddress
            ) {
              skipped++;

              continue;
            }

            const configuredRecipient =
              await rewards.selfRepayRecipient(
                tokenId
              );

            const configuredOwner =
              await rewards.selfRepayOwner(
                tokenId
              );

            if (
              configuredRecipient ===
              ethers.ZeroAddress
            ) {
              console.log(
                `tokenId ${tokenId}: self-repay disabled`
              );

              skipped++;

              continue;
            }

            if (
              ethers.getAddress(
                configuredOwner
              ) !==
              ethers.getAddress(
                owner
              )
            ) {
              console.log(
                `tokenId ${tokenId}: owner changed, self-repay configuration is stale`
              );

              skipped++;

              continue;
            }

            if (
              ethers.getAddress(
                configuredRecipient
              ) !==
              ethers.getAddress(
                EXECUTOR
              )
            ) {
              console.log(
                `tokenId ${tokenId}: self-repay recipient is not executor`
              );

              skipped++;

              continue;
            }

            const alreadyClaimed =
              await rewards.claimed(
                manifestEpoch,
                tokenId
              );

            if (
              alreadyClaimed
            ) {
              console.log(
                `tokenId ${tokenId}: reward already claimed`
              );

              skipped++;

              continue;
            }

            const rewardAmount =
              BigInt(
                position.amount
              );

            if (
              rewardAmount <= 0n
            ) {
              console.log(
                `tokenId ${tokenId}: reward amount is zero`
              );

              skipped++;

              continue;
            }

            const instructions = [];

            for (
              const rawInstruction of
              position.instructions
            ) {
              const debtAsset =
                ethers.getAddress(
                  rawInstruction.debtAsset
                );

              const supported =
                await executor.supportedDebtAsset(
                  debtAsset
                );

              if (!supported) {
                console.log(
                  `tokenId ${tokenId}: ${debtAsset} is not a supported debt asset`
                );

                continue;
              }

              const currentDebt =
                await lendingPool.borrowBalance(
                  owner,
                  debtAsset
                );

              if (
                currentDebt === 0n
              ) {
                continue;
              }

              const rewardAmountIn =
                BigInt(
                  rawInstruction.rewardAmountIn
                );

              const minDebtAssetOut =
                BigInt(
                  rawInstruction.minDebtAssetOut
                );

              if (
                rewardAmountIn <= 0n
              ) {
                continue;
              }

              if (
                minDebtAssetOut <= 0n
              ) {
                continue;
              }

              instructions.push({
                debtAsset,

                rewardAmountIn,

                minDebtAssetOut,

                swapData:
                  rawInstruction.swapData ||
                  "0x"
              });
            }

            if (
              instructions.length === 0
            ) {
              console.log(
                `tokenId ${tokenId}: no executable debt remains`
              );

              skipped++;

              continue;
            }

            const totalRewardInput =
              instructions.reduce(
                (
                  total,
                  instruction
                ) =>
                  total +
                  instruction.rewardAmountIn,
                0n
              );

            if (
              totalRewardInput >
              rewardAmount
            ) {
              console.log(
                `tokenId ${tokenId}: instructions use more reward than allocation`
              );

              skipped++;

              continue;
            }

            console.log(
              `tokenId ${tokenId}: executing ${rewardAmount.toString()} reward across ${instructions.length} debt route(s)`
            );

            const gasEstimate =
              await executor.executeSelfRepay.estimateGas(
                manifestEpoch,
                tokenId,
                rewardAmount,
                position.proof,
                instructions
              );

            const feeData =
              await provider.getFeeData();

            const overrides = {
              gasLimit:
                gasEstimate *
                120n /
                100n
            };

            if (
              feeData.maxFeePerGas
            ) {
              overrides.maxFeePerGas =
                feeData.maxFeePerGas;

              overrides.maxPriorityFeePerGas =
                feeData.maxPriorityFeePerGas ??
                0n;
            } else if (
              feeData.gasPrice
            ) {
              overrides.gasPrice =
                feeData.gasPrice;
            }

            const tx =
              await executor.executeSelfRepay(
                manifestEpoch,
                tokenId,
                rewardAmount,
                position.proof,
                instructions,
                overrides
              );

            console.log(
              `tokenId ${tokenId}: submitted ${tx.hash}`
            );

            const receipt =
              await tx.wait();

            console.log(
              `tokenId ${tokenId}: confirmed in block ${receipt.blockNumber}`
            );

            executed++;
          }

          console.log(
            `Centry V2 keeper complete: executed=${executed}, skipped=${skipped}`
          );
          NODE
