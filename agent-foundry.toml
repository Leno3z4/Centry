[profile.default]
src = "contracts/agents"
test = "contracts/agents/test"
out = "out-agent"
cache_path = "cache-agent"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/"
]

[fmt]
line_length = 100
multiline_func_header = "params_first"
