[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "https://raw.githubusercontent.com/OpenZeppelin/openzeppelin-contracts/v5.4.0/=lib/openzeppelin-contracts/contracts/"
]

[fmt]
line_length = 100
multiline_func_header = "params_first"
