[profile.default]
src = "."
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
allow_paths = [
  "../../lib/openzeppelin-contracts"
]
remappings = [
  "@openzeppelin/=../../lib/openzeppelin-contracts/"
]

[fmt]
line_length = 100
multiline_func_header = "params_first"
